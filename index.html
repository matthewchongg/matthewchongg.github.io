    <script>
      // Circular-masked PNG favicon via 2D Canvas for universal circular browser tab rendering
      window.addEventListener('DOMContentLoaded', function() {
        try {
          var img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = function() {
            var canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            var ctx = canvas.getContext('2d');
            if (!ctx) return;
            ctx.beginPath();
            ctx.arc(32, 32, 32, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();
            ctx.drawImage(img, 0, 0, 64, 64);
            var link = document.getElementById('dynamic-favicon');
            if (link) {
              link.type = 'image/png';
              link.href = canvas.toDataURL('image/png');
            }
          };
          img.src = '/profile-icon.jpg';
        } catch (e) {
          // Graceful fallback to SVG favicon
        }
      });
    </script>
